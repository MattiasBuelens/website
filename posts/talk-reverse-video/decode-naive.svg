<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    .label { font-size: 16px; fill: #000; text-anchor: end; dominant-baseline: middle; }
    .frame-label { font-size: 16px; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
    .decoder-label { font-size: 15px; fill: #fff; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
    .slate { fill: #cbd5e1; stroke: #64748b; stroke-width: 2; }
    .amber { fill: #fde68a; stroke: #d97706; stroke-width: 2; }
    .decoder { fill: #0d9488; stroke: #0f766e; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; }
    .arrowhead { fill: #64748b; }

    @media (prefers-color-scheme: dark) {
      .label { fill: #e2e8f0; }
      .arrow { stroke: #94a3b8; }
      .arrowhead { fill: #94a3b8; }
    }
  </style>

  <text class="label" x="200" y="45">Encoded frames:</text>
  <g>
    <rect class="slate" x="210" y="20" width="56" height="50"/>
    <rect class="amber" x="274" y="20" width="56" height="50"/>
    <rect class="slate" x="338" y="20" width="56" height="50"/>
    <rect class="amber" x="402" y="20" width="56" height="50"/>
    <rect class="slate" x="466" y="20" width="56" height="50"/>
    <rect class="amber" x="530" y="20" width="56" height="50"/>
    <text class="frame-label" x="238" y="46">1</text>
    <text class="frame-label" x="302" y="46">2</text>
    <text class="frame-label" x="366" y="46">3</text>
    <text class="frame-label" x="430" y="46">4</text>
    <text class="frame-label" x="494" y="46">5</text>
    <text class="frame-label" x="558" y="46">6</text>
  </g>

  <line class="arrow" x1="398" y1="70" x2="398" y2="127"/>
  <polygon class="arrowhead" points="398,132 392,120 404,120"/>

  <rect class="decoder" x="343" y="130" width="110" height="40"/>
  <text class="decoder-label" x="398" y="151">VideoDecoder</text>

  <line class="arrow" x1="398" y1="170" x2="398" y2="207"/>
  <polygon class="arrowhead" points="398,212 392,200 404,200"/>

  <text class="label" x="200" y="235">Decoded frames:</text>
  <g>
    <rect class="amber" x="210" y="210" width="56" height="50"/>
    <rect class="slate" x="274" y="210" width="56" height="50"/>
    <rect class="amber" x="338" y="210" width="56" height="50"/>
    <rect class="slate" x="402" y="210" width="56" height="50"/>
    <rect class="amber" x="466" y="210" width="56" height="50"/>
    <rect class="slate" x="530" y="210" width="56" height="50"/>
    <text class="frame-label" x="238" y="236">6</text>
    <text class="frame-label" x="302" y="236">5</text>
    <text class="frame-label" x="366" y="236">4</text>
    <text class="frame-label" x="430" y="236">3</text>
    <text class="frame-label" x="494" y="236">2</text>
    <text class="frame-label" x="558" y="236">1</text>
  </g>
</svg>
